name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: production-play
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      API_URL: ${{ vars.API_URL }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

    steps:
      - name: Check out learner app
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate production configuration
        run: |
          test -n "$API_URL" || { echo "::error::API_URL is not configured"; exit 1; }
          test -n "$TURNSTILE_SITE_KEY" || { echo "::error::TURNSTILE_SITE_KEY is not configured"; exit 1; }

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm config set --location=user //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run lint

      - name: Build
        env:
          VITE_API_URL: ${{ env.API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ env.TURNSTILE_SITE_KEY }}
        run: bun run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
